name: Run Unit Tests

on:
  # Sadece actions'a açılan PR'larda tetikle
  pull_request:
    branches:
      - actions
    types: [opened, synchronize, reopened]

  # (İstersen) push tetiklerini koru; istemiyorsan bu bloğu kaldır
  push:
    branches:
      - main
      - actions

jobs:
  unit-test:
    # PR ise head branch 'feature-can' değilse bu job SKIP olur
    if: github.event_name != 'pull_request' || github.head_ref == 'feature-can'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 🫠
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - run: npm ci
      - run: npm test

  build:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature-can'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  coverage:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature-can'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage --run
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
